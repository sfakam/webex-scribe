name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-app:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build universal binary
        run: |
          GOOS=darwin GOARCH=amd64 go build -o webex-scribe-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o webex-scribe-arm64 .
          lipo -create -output webex-scribe webex-scribe-amd64 webex-scribe-arm64

      - name: Compile AppleScript into .app
        run: |
          osacompile -o "Webex Scribe.app" macos-app/WebexScribe.applescript

      - name: Bundle webex-scribe binary inside .app
        run: |
          cp webex-scribe "Webex Scribe.app/Contents/Resources/"

      - name: Zip the .app
        run: |
          zip -r "Webex-Scribe-macOS-${{ github.ref_name }}.zip" "Webex Scribe.app"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: "Webex-Scribe-macOS-${{ github.ref_name }}.zip"
          generate_release_notes: true
